[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-step-father"
version = "0.1.0"
description = "Yandex Messenger bot platform: BotStepFather + Telegram API compatibility adapter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
bot-step-father = "main:main"
